<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{ site.data.content.meta.theme_color }}">
  <meta name="description" content="{{ site.data.content.meta.description }}">
  <title>{{ site.data.content.meta.title }}</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta property="og:title" content="{{ site.data.content.meta.title }}">
  <meta property="og:description" content="{{ site.data.content.meta.description }}">
  <meta property="og:image" content="{{ site.url }}/{{ site.data.content.meta.og_image }}">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --line: #d3cdc3;
      --text: #3a3a46;
      --muted: #6e6e7c;
      --accent: #6c6fa8;
      --blue: #2e7db0;
      --success: #12876a;
      --mono: "DM Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      --sans: "Manrope", Inter, ui-sans-serif, system-ui, sans-serif;
      --max: 1120px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--sans); line-height: 1.6; letter-spacing: -.015em;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .wrap { width: min(var(--max), calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      height: 76px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(58,58,70,.10);
    }
    .brand { display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:-.06em; font-size:19px; }
    .brand-logo { width:34px; height:34px; object-fit:contain; display:block; }
    .nav { display:flex; gap:25px; align-items:center; color:var(--muted); font-size:13px; }
    .nav a:hover { color:var(--text); }
    .nav .github { color:var(--text); border:1px solid var(--line); padding:8px 13px; border-radius:8px; }
    .nav .github:hover { border-color:var(--accent); background:rgba(58,58,70,.035); }
    .hero { padding: 106px 0 92px; display:grid; grid-template-columns: 1fr .9fr; gap:64px; align-items:center; }
    .eyebrow { color:var(--accent); font:11px var(--mono); letter-spacing:.12em; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
    .eyebrow:before { content:""; width:20px; height:1px; background:var(--blue); }
    h1 { font-size:clamp(48px, 6vw, 76px); line-height:1.04; letter-spacing:-.075em; margin:22px 0 22px; font-weight:700; }
    h1 span { color:var(--blue); }
    .lead { color:#6e6e7c; font-size:17px; max-width:490px; line-height:1.8; margin:0 0 30px; }
    .actions { display:flex; gap:12px; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; gap:9px; border-radius:8px; padding:12px 17px; font-size:13px; font-weight:700; transition:.2s; }
    .btn-primary { background:var(--accent); color:#f4f1ea; }
    .btn-primary:hover { background:#8588bd; transform:translateY(-1px); }
    .btn-secondary { border:1px solid var(--line); color:var(--text); }
    .btn-secondary:hover { border-color:#647568; background:rgba(58,58,70,.035); }
    .micro { margin-top:23px; color:#9a9aa6; font:11px var(--mono); }
    .terminal {
      border-radius:12px; overflow:hidden;
      box-shadow:0 24px 70px rgba(58,58,70,.10), 0 0 0 7px rgba(58,58,70,.025);
      transform: perspective(1100px) rotateY(-3deg) rotateX(1deg);
    }
    .terminal img { width:100%; height:auto; display:block; }
    .facts { border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .facts-grid { display:grid; grid-template-columns:repeat(4,1fr); }
    .fact { padding:22px 20px; border-right:1px solid var(--line); }
    .fact:first-child { padding-left:0; }
    .fact:last-child { border:0; }
    .fact strong { display:block; font-size:14px; font-weight:700; margin-bottom:3px; }
    .fact span { color:var(--muted); font-size:12px; }
    section { padding:100px 0; }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:30px; margin-bottom:38px; }
    .kicker { color:var(--accent); font:11px var(--mono); letter-spacing:.1em; text-transform:uppercase; }
    h2 { font-size:clamp(30px,4vw,43px); line-height:1.15; letter-spacing:-.06em; margin:12px 0 0; }
    .section-note { color:var(--muted); max-width:340px; font-size:13px; line-height:1.8; }
    .feature-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; }
    .feature {
      border:1px solid var(--line); border-radius:10px; padding:24px; min-height:190px;
      background:linear-gradient(145deg, rgba(108,111,168,.06), transparent 70%);
    }
    .feature-icon { width:34px; height:34px; border:1px solid #d3cdc3; color:var(--accent); border-radius:8px; display:grid; place-items:center; font:24px var(--mono); margin-bottom:25px; }
    .feature h3 { margin:0 0 8px; font-size:17px; letter-spacing:-.03em; }
    .feature p { margin:0; color:var(--muted); font-size:13px; line-height:1.8; }
    .security { background:#e7e2d8; border-top:1px solid #d3cdc3; border-bottom:1px solid #d3cdc3; }
    .security-layout { display:grid; grid-template-columns:.8fr 1.2fr; gap:90px; align-items:start; }
    .security-copy p { color:var(--muted); font-size:14px; line-height:1.9; max-width:390px; }
    .security-list { border-top:1px solid var(--line); }
    .security-row { display:grid; grid-template-columns:34px 1fr; gap:16px; padding:19px 0; border-bottom:1px solid var(--line); }
    .number { color:var(--accent); font:11px var(--mono); padding-top:4px; }
    .security-row strong { display:block; font-size:14px; margin-bottom:4px; }
    .security-row span { color:var(--muted); font-size:13px; }
    .install-layout { display:grid; grid-template-columns:.8fr 1.2fr; gap:80px; align-items:start; }
    .install-copy p { color:var(--muted); font-size:14px; line-height:1.9; }
    .code-list { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .code-item { padding:18px 20px; border-bottom:1px solid var(--line); }
    .code-item:last-child { border:0; }
    .code-label { color:var(--muted); font:10px var(--mono); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
    .code-line { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    code { color:#345b77; font:12px/1.7 var(--mono); overflow-wrap:anywhere; }
    .copy { border:1px solid var(--line); color:var(--muted); background:transparent; border-radius:6px; padding:6px 9px; cursor:pointer; font:10px var(--mono); flex:none; }
    .copy:hover { color:var(--accent); border-color:#526b56; }
    .bottom { padding:28px 0; border-top:1px solid var(--line); color:#6e6e7c; font-size:11px; }
    .bottom-inner { display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .bottom-links { display:flex; gap:20px; }
    .bottom a:hover { color:var(--accent); }
    @media (max-width:800px) {
      .hero { grid-template-columns:1fr; gap:48px; padding:75px 0 65px; }
      .terminal { max-width:600px; transform:none; }
      .facts-grid { grid-template-columns:repeat(2,1fr); }
      .fact:nth-child(2) { border-right:0; }
      .fact:nth-child(3), .fact:nth-child(4) { border-top:1px solid var(--line); }
      .fact:nth-child(3) { padding-left:0; }
      .feature-grid { grid-template-columns:repeat(2,1fr); }
      .security-layout,.install-layout { grid-template-columns:1fr; gap:35px; }
      section { padding:72px 0; }
    }
    @media (max-width:520px) {
      .wrap { width:min(100% - 34px, var(--max)); }
      .topbar { height:65px; }
      .nav { gap:14px; font-size:11px; }
      .nav a:not(.github) { display:none; }
      h1 { font-size:51px; }
      .lead { font-size:15px; }
      .feature-grid { grid-template-columns:1fr; }
      .feature { min-height:0; }
      .section-head { display:block; }
      .section-note { margin-top:15px; }
      .terminal { max-width:none; aspect-ratio:500/413; }
      .terminal img { width:200%; height:auto; }
      .bottom-inner { align-items:flex-start; flex-direction:column; }
      .code-line { align-items:flex-start; }
    }
  </style>
</head>
