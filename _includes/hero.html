    <div class="wrap hero">
      <div>
        <div class="eyebrow">{{ site.data.content.hero.eyebrow }}</div>
        <h1>{{ site.data.content.hero.title }}</h1>
        <p class="lead">{{ site.data.content.hero.lead }}</p>
        <div class="actions">
          <a class="btn btn-primary" href="{{ site.data.content.hero.cta_primary.href }}">{{ site.data.content.hero.cta_primary.text }}</a>
          <a class="btn btn-secondary" href="{{ site.data.content.hero.cta_secondary.href }}" target="_blank" rel="noreferrer">{{ site.data.content.hero.cta_secondary.text }}</a>
        </div>
        <div class="micro">{{ site.data.content.hero.micro }}</div>
      </div>
      <div class="terminal" aria-label="{{ site.data.content.hero.terminal_aria }}">
        <img src="{{ site.data.content.hero.terminal_img }}" alt="{{ site.data.content.hero.terminal_alt }}" />
      </div>
    </div>
