<header class="wrap topbar">
  <a class="brand" href="#" aria-label="{{ site.data.content.nav.brand_aria }}"><img class="brand-logo" src="assets/img/cretopass.png" alt="" /> {{ site.data.content.nav.brand }}</a>
  <nav class="nav" aria-label="{{ site.data.content.nav.nav_aria }}">
    {% for link in site.data.content.nav.links %}
    <a href="{{ link.href }}">{{ link.text }}</a>
    {% endfor %}
    <a class="github" href="{{ site.data.content.nav.github.href }}" target="_blank" rel="noreferrer">{{ site.data.content.nav.github.text }}</a>
  </nav>
</header>
