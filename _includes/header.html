<header class="masthead">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#202020"/>
        <path d="M32 17v9M32 26H19v9M32 26h13v9" fill="none" stroke="#9EA1C8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="32" cy="14.5" r="5" fill="#5CC9F5"/>
        <circle cx="19" cy="39" r="4.5" fill="#23EBC0"/>
        <circle cx="45" cy="39" r="4.5" fill="#23EBC0"/>
      </svg>
      cretopass<span class="cursor">_</span>
    </a>
    <nav aria-label="Main">
      <a href="{{ '/docs/' | relative_url }}" {% if page.url contains '/docs/' %}aria-current="page"{% endif %}>Docs</a>
      <a href="{{ '/docs/install/' | relative_url }}">Install</a>
      <a href="{{ '/docs/security/' | relative_url }}">Security</a>
      {% if site.articles.size > 0 %}
      <a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing/' %}aria-current="page"{% endif %}>Writing</a>
      {% endif %}
      <a class="gh" href="{{ site.repo }}" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>
