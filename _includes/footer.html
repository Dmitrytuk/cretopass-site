<footer class="bottom">
  <div class="wrap bottom-inner">
    <div>{{ site.data.content.footer.copyright }}</div>
    <div class="bottom-links">
      {% for link in site.data.content.footer.links %}
      <a href="{{ link.href }}" target="_blank" rel="noreferrer">{{ link.text }}</a>
      {% endfor %}
    </div>
  </div>
</footer>
