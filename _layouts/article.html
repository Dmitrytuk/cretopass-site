---
layout: default
---
<div class="wrap doc">
  <article class="doc-body prose" style="grid-column: 1 / -1;">
    <header class="doc-header">
      <p class="crumb"><a href="{{ '/writing/' | relative_url }}">Writing</a></p>
      <h1>{{ page.title }}</h1>
      {% if page.summary %}<p class="summary">{{ page.summary }}</p>{% endif %}
      {% if page.date %}<p class="summary"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time></p>{% endif %}
    </header>
    {{ content }}
  </article>
</div>
